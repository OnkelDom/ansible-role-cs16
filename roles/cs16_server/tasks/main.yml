---
- name: Read configured foreign architectures
  ansible.builtin.command: dpkg --print-foreign-architectures
  register: cs16_foreign_architectures
  changed_when: false

- name: Enable i386 architecture
  ansible.builtin.command: dpkg --add-architecture i386
  when: "'i386' not in cs16_foreign_architectures.stdout_lines"
  register: cs16_i386_added
  changed_when: cs16_i386_added.rc == 0

- name: Install runtime packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - tar
      - unzip
      - xz-utils
      - libc6-i386
      - lib32gcc-s1
      - lib32stdc++6
      - ufw
      - python3
      - fail2ban
    state: present
    update_cache: true

- name: Create CS 1.6 service group
  ansible.builtin.group:
    name: "{{ cs16_group }}"
    system: true

- name: Create CS 1.6 service account
  ansible.builtin.user:
    name: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    home: "{{ cs16_home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true

- name: Create server directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0750"
  loop:
    - "{{ cs16_steamcmd_dir }}"
    - "{{ cs16_server_dir }}"

- name: Download SteamCMD
  ansible.builtin.get_url:
    url: "{{ cs16_steamcmd_url }}"
    dest: "{{ cs16_steamcmd_dir }}/steamcmd_linux.tar.gz"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0640"

- name: Extract SteamCMD
  ansible.builtin.unarchive:
    src: "{{ cs16_steamcmd_dir }}/steamcmd_linux.tar.gz"
    dest: "{{ cs16_steamcmd_dir }}"
    remote_src: true
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    creates: "{{ cs16_steamcmd_dir }}/steamcmd.sh"

- name: Install HLDS and Counter-Strike
  ansible.builtin.command:
    argv:
      - "{{ cs16_steamcmd_dir }}/steamcmd.sh"
      - +force_install_dir
      - "{{ cs16_server_dir }}"
      - +login
      - anonymous
      - +app_set_config
      - "90"
      - mod
      - cstrike
      - +app_update
      - "90"
      - validate
      - +quit
    creates: "{{ cs16_server_dir }}/hlds_run"
  become_user: "{{ cs16_user }}"

- name: Create Steam SDK compatibility directory
  ansible.builtin.file:
    path: "{{ cs16_home }}/.steam/sdk32"
    state: directory
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0750"

- name: Link 32-bit Steam client library
  ansible.builtin.file:
    src: "{{ cs16_steamcmd_dir }}/linux32/steamclient.so"
    dest: "{{ cs16_home }}/.steam/sdk32/steamclient.so"
    state: link
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"

- name: Download server extensions
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/tmp/{{ item.file }}"
    mode: "0644"
  loop:
    - { url: "{{ cs16_amxx_base_url }}", file: amxx-base.tar.gz }
    - { url: "{{ cs16_amxx_cstrike_url }}", file: amxx-cstrike.tar.gz }
    - { url: "{{ cs16_metamod_url }}", file: metamod.zip }
    - { url: "{{ cs16_yapb_url }}", file: yapb.tar.xz }

- name: Install AMX Mod X base
  ansible.builtin.unarchive:
    src: /tmp/amxx-base.tar.gz
    dest: "{{ cs16_server_dir }}/cstrike"
    remote_src: true
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    creates: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/dlls/amxmodx_mm_i386.so"
  notify: Restart cs16

- name: Install AMX Mod X Counter-Strike addon
  ansible.builtin.unarchive:
    src: /tmp/amxx-cstrike.tar.gz
    dest: "{{ cs16_server_dir }}/cstrike"
    remote_src: true
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    creates: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/modules/cstrike_amxx_i386.so"
  notify: Restart cs16

- name: Install Metamod
  ansible.builtin.unarchive:
    src: /tmp/metamod.zip
    dest: "{{ cs16_server_dir }}/cstrike"
    remote_src: true
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    creates: "{{ cs16_server_dir }}/cstrike/addons/metamod/dlls/metamod.so"
  notify: Restart cs16

- name: Install YaPB
  ansible.builtin.unarchive:
    src: /tmp/yapb.tar.xz
    dest: "{{ cs16_server_dir }}/cstrike"
    remote_src: true
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    creates: "{{ cs16_server_dir }}/cstrike/addons/yapb/bin/yapb.so"
  notify: Restart cs16

- name: Configure Metamod as game DLL
  ansible.builtin.lineinfile:
    path: "{{ cs16_server_dir }}/cstrike/liblist.gam"
    regexp: '^gamedll_linux '
    line: 'gamedll_linux "addons/metamod/dlls/metamod.so"'
  notify: Restart cs16

- name: Configure Metamod plugins
  ansible.builtin.template:
    src: plugins.ini.j2
    dest: "{{ cs16_server_dir }}/cstrike/addons/metamod/plugins.ini"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0640"
  notify: Restart cs16

- name: Configure YaPB
  ansible.builtin.lineinfile:
    path: "{{ cs16_server_dir }}/cstrike/addons/yapb/conf/yapb.cfg"
    regexp: "^{{ item.key }} "
    line: '{{ item.key }} "{{ item.value }}"'
  loop:
    - { key: yb_quota, value: "{{ cs16_bot_fill_players }}" }
    - { key: yb_quota_mode, value: fill }
    - { key: yb_kick_after_player_connect, value: '1' }
    - { key: yb_difficulty, value: "{{ cs16_bot_difficulty }}" }
    - { key: yb_think_fps, value: "{{ cs16_bot_think_fps }}" }
    - { key: yb_shoots_thru_walls, value: "{{ cs16_bot_shoots_thru_walls }}" }
    - { key: yb_chat, value: "{{ cs16_bot_chat_enabled }}" }
    - { key: yb_chat_percent, value: "{{ cs16_bot_chat_percent }}" }
  notify: Restart cs16

- name: Configure server
  ansible.builtin.template:
    src: server.cfg.j2
    dest: "{{ cs16_server_dir }}/cstrike/server.cfg"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0640"
  notify: Restart cs16

- name: Configure map cycle
  ansible.builtin.template:
    src: mapcycle.txt.j2
    dest: "{{ cs16_server_dir }}/cstrike/mapcycle.txt"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0640"
  notify: Restart cs16

- name: Configure AMX Mod X map list
  ansible.builtin.template:
    src: maps.ini.j2
    dest: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/configs/maps.ini"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0640"
  notify: Restart cs16

- name: Configure AMX Mod X admins
  ansible.builtin.template:
    src: users.ini.j2
    dest: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/configs/users.ini"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0640"
  notify: Restart cs16

- name: Install LenMail AMX Mod X plugin sources
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/scripting/{{ item }}"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0640"
  loop:
    - classic_plus.sma
    - lenmail_fun_sounds.sma
  register: cs16_plugin_sources

- name: Compile LenMail AMX Mod X plugins
  ansible.builtin.command:
    argv:
      - ./amxxpc
      - "{{ cs16_server_dir }}/cstrike/addons/amxmodx/scripting/{{ item }}"
      - "-o{{ cs16_server_dir }}/cstrike/addons/amxmodx/plugins/{{ item | regex_replace('\\.sma$', '.amxx') }}"
    chdir: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/scripting"
  become_user: "{{ cs16_user }}"
  loop:
    - classic_plus.sma
    - lenmail_fun_sounds.sma
  when: cs16_plugin_sources.changed
  notify: Restart cs16

- name: Enable LenMail AMX Mod X plugins
  ansible.builtin.lineinfile:
    path: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/configs/plugins.ini"
    line: "{{ item }}"
    state: present
  loop:
    - classic_plus.amxx
    - lenmail_fun_sounds.amxx
  notify: Restart cs16

- name: Install MapManager plugin
  ansible.builtin.copy:
    src: mapmanager.amxx
    dest: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/plugins/mapmanager.amxx"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0644"
  notify: Restart cs16

- name: Install MapManager configuration
  ansible.builtin.copy:
    src: mapmanager.cfg
    dest: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/configs/mapmanager.cfg"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0640"
  notify: Restart cs16

- name: Install MapManager language file
  ansible.builtin.copy:
    src: mapmanager.txt
    dest: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/data/lang/mapmanager.txt"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0644"
  notify: Restart cs16

- name: Disable built-in map voting plugins
  ansible.builtin.replace:
    path: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/configs/plugins.ini"
    regexp: '^(nextmap|mapchooser)\.amxx'
    replace: ';\1.amxx'
  notify: Restart cs16

- name: Enable MapManager
  ansible.builtin.lineinfile:
    path: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/configs/plugins.ini"
    line: mapmanager.amxx
    state: present
  notify: Restart cs16

- name: Create announcer and FastDL directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0755"
  loop:
    - "{{ cs16_server_dir }}/cstrike/sound/lenmail_classic"
    - "{{ cs16_fastdl_root }}/cstrike/sound/lenmail_classic"
  when: cs16_fastdl_enabled | bool

- name: Install announcer sounds on game server
  ansible.builtin.copy:
    src: announcer/
    dest: "{{ cs16_server_dir }}/cstrike/sound/lenmail_classic/"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0644"
  notify: Restart cs16

- name: Publish announcer sounds through FastDL
  ansible.builtin.copy:
    src: announcer/
    dest: "{{ cs16_fastdl_root }}/cstrike/sound/lenmail_classic/"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0644"
  when: cs16_fastdl_enabled | bool
  notify: Restart cs16 fastdl

- name: Configure AMX Mod X map voting
  ansible.builtin.lineinfile:
    path: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/configs/amxx.cfg"
    regexp: "^{{ item.key }} "
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - { key: amx_extendmap_max, value: "{{ cs16_amx_extendmap_max }}" }
    - { key: amx_extendmap_step, value: "{{ cs16_amx_extendmap_step }}" }
  notify: Restart cs16

- name: Configure AMX Mod X statistics and event announcements
  ansible.builtin.template:
    src: stats.ini.j2
    dest: "{{ cs16_server_dir }}/cstrike/addons/amxmodx/configs/stats.ini"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0640"
  notify: Restart cs16

- name: Install bundled community map content on game server
  ansible.builtin.copy:
    src: custom_content/cstrike/
    dest: "{{ cs16_server_dir }}/cstrike/"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0644"
  when: cs16_install_bundled_maps | bool
  notify: Restart cs16

- name: Publish bundled community map content through FastDL
  ansible.builtin.copy:
    src: custom_content/cstrike/
    dest: "{{ cs16_fastdl_root }}/cstrike/"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0644"
  when:
    - cs16_install_bundled_maps | bool
    - cs16_fastdl_enabled | bool
  notify: Restart cs16 fastdl

- name: Install optional custom maps
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ cs16_server_dir }}/cstrike/maps/{{ item.filename }}"
    owner: "{{ cs16_user }}"
    group: "{{ cs16_group }}"
    mode: "0640"
  loop: "{{ cs16_custom_maps }}"
  notify: Restart cs16

- name: Install update helper
  ansible.builtin.template:
    src: update-cs16.sh.j2
    dest: /usr/local/sbin/update-cs16
    owner: root
    group: root
    mode: "0750"

- name: Install systemd unit
  ansible.builtin.template:
    src: cs16.service.j2
    dest: /etc/systemd/system/cs16.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart cs16

- name: Install CS 1.6 healthcheck
  ansible.builtin.template:
    src: cs16-healthcheck.py.j2
    dest: /usr/local/sbin/cs16-healthcheck
    owner: root
    group: root
    mode: "0755"
  when: cs16_healthcheck_enabled | bool

- name: Install CS 1.6 healthcheck systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - cs16-healthcheck.service
    - cs16-healthcheck.timer
  when: cs16_healthcheck_enabled | bool
  notify: Reload systemd

- name: Install FastDL systemd unit
  ansible.builtin.template:
    src: cs16-fastdl.service.j2
    dest: /etc/systemd/system/cs16-fastdl.service
    owner: root
    group: root
    mode: "0644"
  when: cs16_fastdl_enabled | bool
  notify:
    - Reload systemd
    - Restart cs16 fastdl

- name: Allow CS 1.6 through UFW
  community.general.ufw:
    rule: allow
    port: "{{ cs16_port }}"
    proto: udp
    comment: Counter-Strike 1.6
  when: cs16_manage_ufw | bool

- name: Allow FastDL through UFW
  community.general.ufw:
    rule: allow
    port: "{{ cs16_fastdl_port }}"
    proto: tcp
    comment: CS 1.6 FastDL
  when:
    - cs16_manage_ufw | bool
    - cs16_fastdl_enabled | bool

- name: Configure Fail2ban whitelist
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/00-cs16-whitelist.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [DEFAULT]
      ignoreip = {{ cs16_fail2ban_ignoreip | join(' ') }}
  when: cs16_manage_fail2ban_whitelist | bool
  notify: Reload fail2ban

- name: Enable and start CS 1.6 server
  ansible.builtin.systemd_service:
    name: cs16.service
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start CS 1.6 healthcheck timer
  ansible.builtin.systemd_service:
    name: cs16-healthcheck.timer
    enabled: true
    state: started
    daemon_reload: true
  when: cs16_healthcheck_enabled | bool

- name: Enable and start FastDL server
  ansible.builtin.systemd_service:
    name: cs16-fastdl.service
    enabled: true
    state: started
    daemon_reload: true
  when: cs16_fastdl_enabled | bool
